<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #05070b;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.jarvis {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

h1 {
    letter-spacing: 8px;
    font-size: 32px;
    margin-bottom: 10px;
}

.status {
    opacity: 0.7;
    margin-bottom: 40px;
}

.core {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 3px solid #42d9ff;
    box-shadow:
        0 0 20px #42d9ff,
        0 0 60px rgba(66,217,255,0.4);

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 40px;

    transition: 0.3s;
}

.core-inner {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #42d9ff;
    box-shadow: 0 0 40px #42d9ff;

    transition: 0.3s;
}

.listening .core {
    transform: scale(1.12);
    box-shadow:
        0 0 30px #42d9ff,
        0 0 90px #42d9ff;
}

.listening .core-inner {
    transform: scale(1.25);
    box-shadow:
        0 0 60px #42d9ff;
}

button {
    border: none;
    border-radius: 15px;
    padding: 16px 30px;
    font-size: 18px;
    background: #42d9ff;
    color: #001018;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

.response {
    margin-top: 30px;
    text-align: center;
    line-height: 1.5;
    min-height: 70px;
    max-width: 400px;
}
</style>
</head>

<body>

<div class="jarvis" id="jarvis">

    <h1>J.A.R.V.I.S.</h1>

    <div class="status" id="status">
        SYSTEM ONLINE
    </div>

    <div class="core">
        <div class="core-inner"></div>
    </div>

    <button onclick="activateJarvis()">
        🎤 ACTIVATE
    </button>

    <div class="response" id="response">
        Ready when you are.
    </div>

</div>

<script>

const jarvis = document.getElementById("jarvis");
const statusText = document.getElementById("status");
const response = document.getElementById("response");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.onstart = function() {

        jarvis.classList.add("listening");

        statusText.innerText = "LISTENING...";

        response.innerText = "I'm listening.";
    };

    recognition.onresult = function(event) {

        const text =
            event.results[0][0].transcript;

        jarvis.classList.remove("listening");

        statusText.innerText = "PROCESSING...";

        response.innerText =
            "You said: " + text;

        jarvisRespond(text);
    };

    recognition.onerror = function(event) {

        jarvis.classList.remove("listening");

        statusText.innerText = "SYSTEM ONLINE";

        response.innerText =
            "I couldn't hear that. Try again.";
    };

    recognition.onend = function() {

        jarvis.classList.remove("listening");

        if (statusText.innerText === "LISTENING...") {
            statusText.innerText = "SYSTEM ONLINE";
        }
    };

} else {

    response.innerText =
        "Voice recognition isn't supported in this browser.";
}


function activateJarvis() {

    if (!recognition) {

        response.innerText =
            "Voice recognition isn't supported here.";

        return;
    }

    recognition.start();
}


function jarvisRespond(text) {

    let reply;

    const command = text.toLowerCase();

    if (command.includes("hello")) {

        reply = "Hello. Systems are online.";

    }

    else if (command.includes("how are you")) {

        reply = "I'm operating normally.";

    }

    else if (command.includes("who are you")) {

        reply = "I am JARVIS, your personal AI assistant.";

    }

    else if (command.includes("what time")) {

        reply =
            "The current time is " +
            new Date().toLocaleTimeString();

    }

    else {

        reply =
            "I heard you say: " + text;
    }

    response.innerText = reply;

    speak(reply);

    statusText.innerText = "SYSTEM ONLINE";
}


function speak(text) {

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.rate = 1;

    speech.pitch = 0.9;

    speech.volume = 1;

    window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
